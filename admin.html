<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>叫號管理後台</title>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 30px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background: #f3f4f6;

    }


    .container {

      max-width: 1000px;

      margin: auto;

    }


    h1 {

      text-align: center;

      margin-bottom: 10px;

    }


    .info {

      text-align: center;

      color: #666;

      margin-bottom: 30px;

    }


    /* =========================
       目前叫號
    ========================= */

    .current-call {

      background: white;

      padding: 25px;

      border-radius: 15px;

      text-align: center;

      margin-bottom: 25px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.08);

    }


    .current-number {

      font-size: 48px;

      font-weight: bold;

      margin-top: 10px;

    }


    /* =========================
       鎖定狀態
    ========================= */

    .lock-status {

      display: none;

      text-align: center;

      margin-bottom: 20px;

      padding: 15px;

      border-radius: 12px;

      font-size: 20px;

      font-weight: bold;

      background: #fef2f2;

      color: #dc2626;

      border: 2px solid #fecaca;

    }


    .lock-status.active {

      display: block;

    }


    /* =========================
       控制按鈕
    ========================= */

    .controls {

      display: flex;

      justify-content: center;

      gap: 15px;

      margin-bottom: 25px;

      flex-wrap: wrap;

    }


    button {

      border: none;

      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;

    }


    .refresh {

      padding: 12px 25px;

      background: #2563eb;

      color: white;

    }


    .reset {

      padding: 12px 25px;

      background: #dc2626;

      color: white;

    }


    .refresh:hover,
    .reset:hover {

      opacity: .85;

    }


    .refresh:disabled,
    .reset:disabled {

      opacity: .5;

      cursor: not-allowed;

    }


    /* =========================
       狀態訊息
    ========================= */

    .status-message {

      text-align: center;

      margin-bottom: 15px;

      color: #666;

    }


    /* =========================
       號碼列表
    ========================= */

    .ticket-grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));

      gap: 15px;

    }


    .ticket {

      background: white;

      padding: 25px 15px;

      border-radius: 15px;

      cursor: pointer;

      font-size: 28px;

      font-weight: bold;

      box-shadow:
        0 5px 15px rgba(0,0,0,.08);

      transition:
        transform .15s,
        box-shadow .15s,
        opacity .15s;

    }


    .ticket:hover:not(:disabled) {

      transform: translateY(-4px);

      box-shadow:
        0 10px 25px rgba(0,0,0,.15);

    }


    .ticket:disabled {

      background: #d1d5db;

      color: #6b7280;

      cursor: not-allowed;

      opacity: .7;

    }


    .ticket small {

      display: block;

      font-size: 14px;

      margin-top: 8px;

      font-weight: normal;

      color: #666;

    }


    .ticket:disabled small {

      color: #6b7280;

    }


    .empty {

      text-align: center;

      color: #888;

      padding: 50px;

      grid-column: 1 / -1;

    }

  </style>

</head>



<body>


<div class="container">


  <h1>🎫 叫號管理後台</h1>


  <p class="info">

    點擊等待中的號碼即可進行叫號

  </p>



  <!-- =========================
       目前叫號
  ========================= -->

  <div class="current-call">


    <div>

      目前叫號

    </div>


    <div
      id="currentNumber"
      class="current-number"
    >

      尚未叫號

    </div>


  </div>



  <!-- =========================
       鎖定倒數
  ========================= -->

  <div
    id="lockStatus"
    class="lock-status"
  >

    🔒 叫號系統同步鎖定中

    <br>

    請等待

    <span id="countdown">

      3

    </span>

    秒

  </div>



  <!-- =========================
       控制按鈕
  ========================= -->

  <div class="controls">


    <button
      id="refreshButton"
      class="refresh"
      onclick="loadAllData()"
    >

      🔄 重新整理

    </button>


    <button
      id="resetButton"
      class="reset"
      onclick="clearAllTickets()"
    >

      🗑️ 清空所有號碼

    </button>


  </div>



  <div
    id="statusMessage"
    class="status-message"
  >
  </div>



  <h2>

    等待中的號碼

  </h2>



  <div
    id="ticketList"
    class="ticket-grid"
  >
  </div>


</div>



<script>


/* =================================
   Supabase 設定
================================= */

const SUPABASE_URL =
  "https://ubrjcadpfdfymbjwubfg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_0J9AWhVkRRYDehVffrmNdQ_jlOOqVAw";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =================================
   全域變數
================================= */

let currentLockUntil = null;

let countdownTimer = null;

let isCalling = false;



/* =================================
   HTML 元素
================================= */

const ticketList =
  document.getElementById(
    "ticketList"
  );


const statusMessage =
  document.getElementById(
    "statusMessage"
  );


const currentNumberElement =
  document.getElementById(
    "currentNumber"
  );


const lockStatus =
  document.getElementById(
    "lockStatus"
  );


const countdownElement =
  document.getElementById(
    "countdown"
  );


const refreshButton =
  document.getElementById(
    "refreshButton"
  );


const resetButton =
  document.getElementById(
    "resetButton"
  );



/* =================================
   判斷目前是否鎖定
================================= */

function isLocked() {

  if (!currentLockUntil) {

    return false;

  }


  const lockTime =
    new Date(
      currentLockUntil
    ).getTime();


  return lockTime > Date.now();

}



/* =================================
   更新所有按鈕狀態
================================= */

function updateButtonState() {


  const locked =
    isLocked() || isCalling;


  const ticketButtons =
    document.querySelectorAll(
      ".ticket"
    );


  ticketButtons.forEach(
    button => {

      button.disabled = locked;

    }
  );


  refreshButton.disabled =
    locked;


  resetButton.disabled =
    locked;

}



/* =================================
   開始倒數
================================= */

function startCountdown() {


  if (countdownTimer) {

    clearInterval(
      countdownTimer
    );

  }


  function updateCountdown() {


    if (!currentLockUntil) {

      stopLock();

      return;

    }


    const remaining =
      new Date(
        currentLockUntil
      ).getTime()
      -
      Date.now();


    if (remaining <= 0) {

      stopLock();

      return;

    }


    const seconds =
      Math.ceil(
        remaining / 1000
      );


    countdownElement.textContent =
      seconds;


    lockStatus.classList.add(
      "active"
    );


    updateButtonState();

  }



  updateCountdown();


  countdownTimer =
    setInterval(
      updateCountdown,
      100
    );

}



/* =================================
   停止鎖定
================================= */

function stopLock() {


  currentLockUntil = null;


  if (countdownTimer) {

    clearInterval(
      countdownTimer
    );


    countdownTimer = null;

  }


  lockStatus.classList.remove(
    "active"
  );


  updateButtonState();

}



/* =================================
   設定鎖定時間
================================= */

function setLock(lockUntil) {


  if (!lockUntil) {

    stopLock();

    return;

  }


  currentLockUntil =
    lockUntil;


  if (isLocked()) {

    startCountdown();

  }

  else {

    stopLock();

  }

}



/* =================================
   讀取目前叫號與鎖定狀態
================================= */

async function loadQueueSettings() {


  const {

    data,

    error

  } = await supabaseClient

    .from(
      "queue_settings"
    )

    .select(
      "*"
    )

    .limit(1)

    .maybeSingle();



  if (error) {

    console.error(
      "讀取叫號設定失敗：",
      error
    );

    return;

  }


  if (!data) {

    currentNumberElement.textContent =
      "尚未叫號";


    stopLock();

    return;

  }



  /* 更新目前叫號 */

  if (data.current_number) {

    currentNumberElement.textContent =
      data.current_number;

  }

  else {

    currentNumberElement.textContent =
      "尚未叫號";

  }



  /* 更新鎖定狀態 */

  if (data.call_lock_until) {

    setLock(
      data.call_lock_until
    );

  }

  else {

    stopLock();

  }

}



/* =================================
   讀取等待中的號碼
================================= */

async function loadTickets() {


  ticketList.innerHTML = "";


  statusMessage.textContent =
    "載入中...";


  const {

    data,

    error

  } = await supabaseClient

    .from(
      "tickets"
    )

    .select(
      "*"
    )

    .eq(
      "status",
      "waiting"
    )

    .order(
      "ticket_number",
      {
        ascending: true
      }
    );



  if (error) {


    console.error(
      error
    );


    ticketList.innerHTML = `

      <div class="empty">

        ❌ 讀取資料失敗

        <br><br>

        ${error.message}

      </div>

    `;


    statusMessage.textContent =
      "";


    return;

  }



  ticketList.innerHTML =
    "";


  statusMessage.textContent =
    `目前共有 ${data.length} 位等待中`;



  if (data.length === 0) {


    ticketList.innerHTML = `

      <div class="empty">

        目前沒有等待中的號碼

      </div>

    `;


    return;

  }



  data.forEach(
    ticket => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "ticket";


      button.innerHTML = `

        ${ticket.display_number}

        <small>

          點擊叫號 🔊

        </small>

      `;



      /* 如果系統正在鎖定 */

      if (
        isLocked() ||
        isCalling
      ) {

        button.disabled =
          true;

      }



      button.addEventListener(

        "click",

        () => callTicket(
          ticket
        )

      );


      ticketList.appendChild(
        button
      );


    }
  );


  updateButtonState();

}



/* =================================
   讀取全部資料
================================= */

async function loadAllData() {


  await loadQueueSettings();


  await loadTickets();

}



/* =================================
   叫號
================================= */

async function callTicket(ticket) {


  /* 前端再次檢查 */

  if (
    isLocked() ||
    isCalling
  ) {

    alert(
      "🔒 目前系統正在叫號，請稍候"
    );

    return;

  }



  const confirmed =
    confirm(
      `確定要叫號 ${ticket.display_number} 嗎？`
    );


  if (!confirmed) {

    return;

  }



  /* 立即鎖定目前這台 */

  isCalling =
    true;


  updateButtonState();



  try {


    const {

      data,

      error

    } = await supabaseClient.rpc(

      "call_ticket",

      {

        p_ticket_id:
          ticket.id

      }

    );



    if (error) {

      throw error;

    }



    /*
      更新目前畫面
    */

    currentNumberElement.textContent =
      ticket.display_number;



    /*
      Function 成功後
      立即套用鎖定時間
    */

    if (
      data &&
      data.call_lock_until
    ) {

      setLock(
        data.call_lock_until
      );

    }

    else {

      /*
        如果 RPC 沒有回傳時間
        重新讀取資料庫
      */

      await loadQueueSettings();

    }



    /*
      更新等待列表
    */

    await loadTickets();


  }


  catch (error) {


    console.error(
      error
    );


    /*
      如果其他設備已經搶先叫號
    */

    alert(
      "叫號失敗：\n" +
      error.message
    );


    /*
      重新同步資料庫狀態
    */

    await loadAllData();

  }


  finally {


    isCalling =
      false;


    updateButtonState();

  }

}



/* =================================
   清空所有號碼
================================= */

async function clearAllTickets() {


  if (isLocked()) {

    alert(
      "🔒 系統正在叫號中，請等待倒數結束"
    );

    return;

  }



  const confirmed =
    confirm(

      "⚠️ 確定要清空目前所有號碼嗎？\n\n" +

      "清空後下一個號碼將重新從 A001 開始。"

    );


  if (!confirmed) {

    return;

  }



  const {

    error

  } = await supabaseClient.rpc(

    "clear_all_tickets"

  );



  if (error) {


    console.error(
      error
    );


    alert(
      "清空失敗：\n" +
      error.message
    );


    return;

  }



  currentNumberElement.textContent =
    "尚未叫號";


  stopLock();


  await loadAllData();


  alert(
    "✅ 所有號碼已成功清空"
  );

}



/* =================================
   Tickets 即時同步
================================= */

supabaseClient

  .channel(
    "tickets-channel"
  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "tickets"

    },

    () => {

      loadTickets();

    }

  )

  .subscribe();



/* =================================
   Queue Settings 即時同步
================================= */

supabaseClient

  .channel(
    "queue-settings-channel"
  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "queue_settings"

    },

    payload => {


      const data =
        payload.new;


      /*
        更新目前叫號
      */

      if (
        data.current_number
      ) {

        currentNumberElement.textContent =
          data.current_number;

      }

      else {

        currentNumberElement.textContent =
          "尚未叫號";

      }



      /*
        更新鎖定狀態
      */

      if (
        data.call_lock_until
      ) {

        setLock(
          data.call_lock_until
        );

      }

      else {

        stopLock();

      }

    }

  )

  .subscribe();



/* =================================
   網頁啟動
================================= */

loadAllData();


</script>


</body>

</html>
