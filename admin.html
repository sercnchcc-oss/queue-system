<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>叫號管理台</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background: #f3f6fb;
      color: #1f2937;
    }


    /* =========================
       頁面容器
    ========================= */

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 40px 30px;
    }


    /* =========================
       標題
    ========================= */

    .page-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title h1 {
      margin: 0;
      font-size: 36px;
    }

    .page-title p {
      margin-top: 10px;
      color: #6b7280;
    }


    /* =========================
       目前叫號
    ========================= */

    .current-card {
      background: white;

      border-radius: 20px;

      padding: 35px;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.08);

      margin-bottom: 25px;
    }


    .current-label {
      font-size: 18px;
      color: #6b7280;
      margin-bottom: 10px;
    }


    .current-number {
      font-size: 64px;
      font-weight: bold;

      color: #111827;

      min-height: 80px;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    /* =========================
       系統狀態
    ========================= */

    .system-status {

      text-align: center;

      font-size: 18px;

      margin-bottom: 25px;

      font-weight: bold;
    }


    .status-ready {
      color: #15803d;
    }


    .status-calling {
      color: #d97706;
    }


    .status-error {
      color: #dc2626;
    }


    /* =========================
       控制按鈕
    ========================= */

    .controls {

      display: flex;

      justify-content: center;

      gap: 15px;

      margin-bottom: 20px;

      flex-wrap: wrap;
    }


    button {

      border: none;

      border-radius: 10px;

      padding: 14px 24px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }


    button:hover {

      transform: translateY(-2px);
    }


    button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;
    }


    .refresh-btn {

      background: #2563eb;

      color: white;
    }


    .clear-btn {

      background: #dc2626;

      color: white;
    }


    /* =========================
       叫號提示
    ========================= */

    .calling-message {

      text-align: center;

      font-size: 18px;

      color: #4b5563;

      min-height: 30px;

      margin-bottom: 30px;
    }


    /* =========================
       等待號碼
    ========================= */

    .queue-title {

      font-size: 24px;

      font-weight: bold;

      margin-bottom: 20px;
    }


    .queue-list {

      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(160px, 1fr));

      gap: 15px;
    }


    /* =========================
       號碼卡片
    ========================= */

    .ticket-card {

      background: white;

      border-radius: 15px;

      padding: 25px 15px;

      text-align: center;

      cursor: pointer;

      box-shadow:
        0 5px 20px rgba(0,0,0,0.08);

      transition: 0.2s;

      user-select: none;
    }


    .ticket-card:hover {

      transform: translateY(-5px);

      box-shadow:
        0 12px 30px rgba(0,0,0,0.15);
    }


    .ticket-number {

      font-size: 30px;

      font-weight: bold;

      color: #111827;

      margin-bottom: 10px;
    }


    .ticket-text {

      color: #6b7280;

      font-size: 14px;
    }


    /* =========================
       沒有等待號碼
    ========================= */

    .empty {

      text-align: center;

      padding: 50px;

      background: white;

      border-radius: 15px;

      color: #6b7280;
    }


    /* =========================
       手機版
    ========================= */

    @media (max-width: 600px) {

      .container {
        padding: 25px 15px;
      }


      .page-title h1 {
        font-size: 28px;
      }


      .current-number {
        font-size: 48px;
      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- =========================
         標題
    ========================== -->

    <div class="page-title">

      <h1>叫號管理台</h1>

      <p>
        點擊等待中的號碼即可進行叫號
      </p>

    </div>



    <!-- =========================
         目前叫號
    ========================== -->

    <div class="current-card">

      <div class="current-label">

        目前叫號

      </div>


      <div
        id="currentNumber"
        class="current-number"
      >

        尚未叫號

      </div>

    </div>



    <!-- =========================
         系統狀態
    ========================== -->

    <div
      id="systemStatus"
      class="system-status status-ready"
    >

      ● 系統可以叫號

    </div>



    <!-- =========================
         控制按鈕
    ========================== -->

    <div class="controls">


      <button
        class="refresh-btn"
        onclick="loadQueue()"
      >

        🔄 重新整理

      </button>



      <button
        class="clear-btn"
        onclick="clearAllTickets()"
      >

        🗑 清空所有號碼

      </button>


    </div>



    <!-- =========================
         叫號訊息
    ========================== -->

    <div
      id="callingMessage"
      class="calling-message"
    ></div>



    <!-- =========================
         等待號碼
    ========================== -->

    <div
      id="queueTitle"
      class="queue-title"
    >

      等待中的號碼

    </div>



    <div
      id="queueList"
      class="queue-list"
    >

    </div>


  </div>



  <script>


    /* =====================================
       Supabase 設定

       ⚠️ 請修改這兩個地方
    ====================================== */


    const SUPABASE_URL = 'https://ubrjcadpfdfymbjwubfg.supabase.co';


    const SUPABASE_ANON_KEY = 'sb_publishable_0J9AWhVkRRYDehVffrmNdQ_jlOOqVAw';



    /* =====================================
       建立 Supabase Client
    ====================================== */


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );



    /* =====================================
       全域變數
    ====================================== */


    let currentEventId = null;


    let isCalling = false;



    /* =====================================
       網頁載入完成
    ====================================== */


    document.addEventListener(
      'DOMContentLoaded',
      async () => {

        await loadQueue();

        setInterval(
          loadQueue,
          5000
        );

      }
    );



    /* =====================================
       載入目前 Queue
    ====================================== */


    async function loadQueue() {


      if (isCalling) {
        return;
      }


      try {


        /* =========================
           取得等待中的號碼
        ========================== */


        const {
          data: tickets,
          error: ticketError
        } = await supabaseClient

          .from('tickets')

          .select(`
            id,
            ticket_number,
            display_number,
            status,
            event_id
          `)

          .eq(
            'status',
            'waiting'
          )

          .order(
            'ticket_number',
            {
              ascending: true
            }
          );


        if (ticketError) {

          throw ticketError;

        }



        /* =========================
           找到目前 Event ID
        ========================== */


        if (
          tickets &&
          tickets.length > 0
        ) {

          currentEventId =
            tickets[0].event_id;

        }



        /* =========================
           顯示等待號碼
        ========================== */


        renderQueue(
          tickets || []
        );



        /* =========================
           載入目前叫號
        ========================== */


        if (currentEventId) {

          await loadCurrentNumber(
            currentEventId
          );

        }


      }

      catch (error) {


        console.error(
          '載入 Queue 發生錯誤：',
          error
        );


        setSystemStatus(
          '● 載入資料失敗',
          'error'
        );

      }

    }



    /* =====================================
       顯示等待號碼
    ====================================== */


    function renderQueue(tickets) {


      const queueList =
        document.getElementById(
          'queueList'
        );


      const queueTitle =
        document.getElementById(
          'queueTitle'
        );


      queueTitle.innerText =
        `等待中的號碼（${tickets.length}）`;


      queueList.innerHTML = '';


      if (
        tickets.length === 0
      ) {

        queueList.innerHTML = `

          <div class="empty">

            目前沒有等待中的號碼

          </div>

        `;


        return;

      }



      tickets.forEach(
        ticket => {


          const card =
            document.createElement('div');


          card.className =
            'ticket-card';



          card.innerHTML = `

            <div class="ticket-number">

              ${ticket.display_number}

            </div>


            <div class="ticket-text">

              點擊叫號 🔊

            </div>

          `;



          card.addEventListener(
            'click',
            () => {

              callTicket(
                ticket.id,
                ticket.display_number
              );

            }
          );



          queueList.appendChild(
            card
          );

        }
      );

    }



    /* =====================================
       載入目前叫號
    ====================================== */


    async function loadCurrentNumber(eventId) {


      try {


        const {
          data,
          error
        } = await supabaseClient

          .from('queue_settings')

          .select(`
            current_number,
            call_lock_until
          `)

          .eq(
            'event_id',
            eventId
          )

          .maybeSingle();



        if (error) {

          throw error;

        }



        const currentNumber =
          document.getElementById(
            'currentNumber'
          );



        if (
          data &&
          data.current_number
        ) {

          currentNumber.innerText =
            data.current_number;

        }

        else {

          currentNumber.innerText =
            '尚未叫號';

        }


      }

      catch (error) {


        console.error(
          '載入目前叫號失敗：',
          error
        );

      }

    }



    /* =====================================
       叫號
    ====================================== */


    async function callTicket(
      ticketId,
      displayNumber
    ) {


      if (isCalling) {

        alert(
          '系統正在叫號中，請稍後再試'
        );

        return;

      }



      const confirmCall =
        confirm(
          `確定要叫號 ${displayNumber} 嗎？`
        );



      if (!confirmCall) {

        return;

      }



      try {


        /* =========================
           設定叫號中
        ========================== */


        isCalling = true;



        setSystemStatus(
          '● 系統正在叫號中',
          'calling'
        );



        document.getElementById(
          'callingMessage'
        ).innerText =
          `正在叫號 ${displayNumber}...`;



        /* =========================
           呼叫 Supabase Function

           ⚠️ 重要：
           這裡一定要是 p_ticket_id
        ========================== */


        const {
          data,
          error
        } = await supabaseClient.rpc(
          'call_ticket',
          {
            p_ticket_id: ticketId
          }
        );



        if (error) {

          throw error;

        }



        console.log(
          '叫號成功：',
          data
        );



        /* =========================
           更新目前叫號
        ========================== */


        document.getElementById(
          'currentNumber'
        ).innerText =
          displayNumber;



        /* =========================
           播放語音
        ========================== */


        speakNumber(
          displayNumber
        );



        /* =========================
           等待 3 秒
        ========================== */


        await new Promise(
          resolve => {

            setTimeout(
              resolve,
              3000
            );

          }
        );



        document.getElementById(
          'callingMessage'
        ).innerText = '';



        isCalling = false;



        setSystemStatus(
          '● 系統可以叫號',
          'ready'
        );



        /* =========================
           重新載入 Queue
        ========================== */


        await loadQueue();


      }

      catch (error) {


        console.error(
          '叫號失敗：',
          error
        );



        isCalling = false;



        setSystemStatus(
          '● 系統發生錯誤',
          'error'
        );



        document.getElementById(
          'callingMessage'
        ).innerText = '';



        alert(
          error.message ||
          '叫號失敗'
        );


        setTimeout(
          () => {

            setSystemStatus(
              '● 系統可以叫號',
              'ready'
            );

          },
          3000
        );

      }

    }



    /* =====================================
       語音叫號
    ====================================== */


    function speakNumber(displayNumber) {


      if (
        !('speechSynthesis' in window)
      ) {

        console.warn(
          '此瀏覽器不支援語音功能'
        );

        return;

      }



      window.speechSynthesis.cancel();



      const text =
        `請 ${displayNumber} 號到櫃台辦理`;


      const speech =
        new SpeechSynthesisUtterance(
          text
        );



      speech.lang =
        'zh-TW';



      speech.rate =
        0.8;



      speech.pitch =
        1;



      window.speechSynthesis.speak(
        speech
      );

    }



    /* =====================================
       清空所有號碼
    ====================================== */


    async function clearAllTickets() {


      const confirmClear =
        confirm(
          '確定要清空所有等待中的號碼嗎？此操作無法復原。'
        );


      if (!confirmClear) {

        return;

      }



      try {


        const {
          error
        } = await supabaseClient

          .from('tickets')

          .delete()

          .eq(
            'status',
            'waiting'
          );



        if (error) {

          throw error;

        }



        alert(
          '等待中的號碼已清空'
        );



        await loadQueue();


      }

      catch (error) {


        console.error(
          '清空失敗：',
          error
        );


        alert(
          error.message ||
          '清空失敗'
        );

      }

    }



    /* =====================================
       更新系統狀態
    ====================================== */


    function setSystemStatus(
      text,
      type
    ) {


      const element =
        document.getElementById(
          'systemStatus'
        );


      element.innerText =
        text;


      element.className =
        'system-status';


      if (
        type === 'ready'
      ) {

        element.classList.add(
          'status-ready'
        );

      }


      if (
        type === 'calling'
      ) {

        element.classList.add(
          'status-calling'
        );

      }


      if (
        type === 'error'
      ) {

        element.classList.add(
          'status-error'
        );

      }

    }


  </script>


</body>
</html>
