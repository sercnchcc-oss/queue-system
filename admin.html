<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>叫號管理後台</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 30px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background: #f3f4f6;

    }


    .container {

      max-width: 1000px;

      margin: auto;

    }


    h1 {

      text-align: center;

      margin-bottom: 10px;

    }


    .info {

      text-align: center;

      color: #666;

      margin-bottom: 30px;

    }


    /* =========================
       目前叫號
    ========================= */

    .current-call {

      background: white;

      padding: 25px;

      border-radius: 15px;

      text-align: center;

      margin-bottom: 30px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.08);

    }


    .current-number {

      font-size: 48px;

      font-weight: bold;

      margin-top: 10px;

    }


    /* =========================
       控制按鈕
    ========================= */

    .controls {

      display: flex;

      justify-content: center;

      gap: 15px;

      margin-bottom: 25px;

      flex-wrap: wrap;

    }


    button {

      border: none;

      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;

    }


    .refresh {

      padding: 12px 25px;

      background: #2563eb;

      color: white;

    }


    .reset {

      padding: 12px 25px;

      background: #dc2626;

      color: white;

    }


    button:hover {

      opacity: .85;

    }


    /* =========================
       狀態訊息
    ========================= */

    .status-message {

      text-align: center;

      margin-bottom: 15px;

      color: #666;

    }


    /* =========================
       號碼列表
    ========================= */

    .ticket-grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));

      gap: 15px;

    }


    .ticket {

      background: white;

      padding: 25px 15px;

      border-radius: 15px;

      cursor: pointer;

      font-size: 28px;

      font-weight: bold;

      box-shadow:
        0 5px 15px rgba(0,0,0,.08);

      transition:
        transform .15s,
        box-shadow .15s;

    }


    .ticket:hover {

      transform: translateY(-4px);

      box-shadow:
        0 10px 25px rgba(0,0,0,.15);

    }


    .ticket small {

      display: block;

      font-size: 14px;

      margin-top: 8px;

      font-weight: normal;

      color: #666;

    }


    .empty {

      text-align: center;

      color: #888;

      padding: 50px;

      grid-column: 1 / -1;

    }


  </style>

</head>


<body>


<div class="container">


  <h1>🎫 叫號管理後台</h1>


  <p class="info">

    點擊等待中的號碼即可進行叫號

  </p>


  <!-- =========================
       目前叫號
  ========================= -->

  <div class="current-call">

    <div>
      目前叫號
    </div>


    <div
      id="currentNumber"
      class="current-number"
    >
      尚未叫號
    </div>

  </div>


  <!-- =========================
       控制按鈕
  ========================= -->

  <div class="controls">


    <button
      class="refresh"
      onclick="refreshAll()"
    >
      🔄 重新整理
    </button>


    <button
      class="reset"
      onclick="clearAllTickets()"
    >
      🗑️ 清空所有號碼
    </button>


  </div>


  <div
    id="statusMessage"
    class="status-message"
  >
  </div>


  <h2>
    等待中的號碼
  </h2>


  <div
    id="ticketList"
    class="ticket-grid"
  >
  </div>


</div>


<script>


/* ================================
   Supabase 設定
================================ */

const SUPABASE_URL =
  "https://ubrjcadpfdfymbjwubfg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_0J9AWhVkRRYDehVffrmNdQ_jlOOqVAw";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ================================
   取得目前啟用活動
================================ */

async function getActiveEvent() {

  const {

    data,

    error

  } = await supabaseClient

    .from("events")

    .select("id")

    .eq(
      "is_active",
      true
    )

    .order(
      "created_at",
      {
        ascending: false
      }
    )

    .limit(1)

    .maybeSingle();


  if (error) {

    console.error(
      "讀取活動失敗：",
      error
    );

    return null;

  }


  return data;

}


/* ================================
   讀取等待中的號碼
================================ */

async function loadTickets() {


  const ticketList =
    document.getElementById(
      "ticketList"
    );


  const statusMessage =
    document.getElementById(
      "statusMessage"
    );


  ticketList.innerHTML = "";


  statusMessage.textContent =
    "載入中...";


  /* 取得目前活動 */

  const activeEvent =
    await getActiveEvent();


  if (!activeEvent) {

    statusMessage.textContent =
      "目前沒有啟用中的活動";


    ticketList.innerHTML = `

      <div class="empty">

        目前沒有啟用中的活動

      </div>

    `;

    return;

  }


  /* 讀取該活動的等待號碼 */

  const {

    data,

    error

  } = await supabaseClient

    .from("tickets")

    .select("*")

    .eq(
      "event_id",
      activeEvent.id
    )

    .eq(
      "status",
      "waiting"
    )

    .order(
      "ticket_number",
      {
        ascending: true
      }
    );


  if (error) {


    console.error(
      "讀取號碼失敗：",
      error
    );


    ticketList.innerHTML = `

      <div class="empty">

        ❌ 讀取資料失敗

        <br><br>

        ${error.message}

      </div>

    `;


    statusMessage.textContent = "";


    return;

  }


  ticketList.innerHTML = "";


  statusMessage.textContent =
    `目前共有 ${data.length} 位等待中`;


  if (data.length === 0) {


    ticketList.innerHTML = `

      <div class="empty">

        目前沒有等待中的號碼

      </div>

    `;


    return;

  }


  data.forEach(
    ticket => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "ticket";


      button.innerHTML = `

        ${ticket.display_number}

        <small>
          點擊叫號 🔊
        </small>

      `;


      button.addEventListener(

        "click",

        () => callTicket(ticket)

      );


      ticketList.appendChild(
        button
      );


    }
  );


}


/* ================================
   讀取目前叫號
================================ */

async function loadCurrentNumber() {


  const {

    data,

    error

  } = await supabaseClient

    .from("queue_settings")

    .select("*")

    .order(
      "updated_at",
      {
        ascending: false
      }
    )

    .limit(1)

    .maybeSingle();


  if (error) {

    console.error(
      "讀取目前叫號失敗：",
      error
    );

    return;

  }


  const currentNumberElement =
    document.getElementById(
      "currentNumber"
    );


  if (

    data &&
    data.current_number

  ) {


    currentNumberElement.textContent =
      data.current_number;

  }

  else {


    currentNumberElement.textContent =
      "尚未叫號";

  }


}


/* ================================
   叫號
================================ */

async function callTicket(ticket) {


  const confirmed =
    confirm(
      `確定要叫號 ${ticket.display_number} 嗎？`
    );


  if (!confirmed) {

    return;

  }


  const {

    error

  } = await supabaseClient.rpc(

    "call_ticket",

    {

      target_ticket_id:
        ticket.id

    }

  );


  if (error) {


    console.error(
      "叫號失敗：",
      error
    );


    alert(
      "叫號失敗：\n" +
      error.message
    );


    return;

  }


  /* 立即更新畫面 */

  document
    .getElementById(
      "currentNumber"
    )
    .textContent =
      ticket.display_number;


  /* 重新讀取 */

  await loadTickets();

  await loadCurrentNumber();


}


/* ================================
   清空所有號碼
================================ */

async function clearAllTickets() {


  const confirmed =
    confirm(
      "⚠️ 確定要清空目前所有號碼嗎？\n\n清空後下一個號碼將重新從 A001 開始。"
    );


  if (!confirmed) {

    return;

  }


  const {

    error

  } = await supabaseClient.rpc(
    "clear_all_tickets"
  );


  if (error) {


    console.error(
      "清空失敗：",
      error
    );


    alert(
      "清空失敗：\n" +
      error.message
    );


    return;

  }


  /* 清空目前叫號畫面 */

  document
    .getElementById(
      "currentNumber"
    )
    .textContent =
      "尚未叫號";


  /* 重新讀取 */

  await loadTickets();

  await loadCurrentNumber();


  alert(
    "✅ 所有號碼已成功清空"
  );


}


/* ================================
   手動重新整理
================================ */

async function refreshAll() {

  await loadTickets();

  await loadCurrentNumber();

}


/* ================================
   Tickets 即時同步
================================ */

supabaseClient

  .channel(
    "tickets-channel"
  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "tickets"

    },

    () => {

      console.log(
        "Tickets 資料更新"
      );


      loadTickets();

    }

  )

  .subscribe(
    status => {

      console.log(
        "Tickets 即時連線：",
        status
      );

    }
  );


/* ================================
   Queue 即時同步
================================ */

supabaseClient

  .channel(
    "queue-channel"
  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "queue_settings"

    },

    () => {

      console.log(
        "目前叫號資料更新"
      );


      loadCurrentNumber();

    }

  )

  .subscribe(
    status => {

      console.log(
        "Queue 即時連線：",
        status
      );

    }
  );


/* ================================
   網頁啟動
================================ */

refreshAll();


</script>


</body>

</html>
