<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>叫號管理後台</title>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {

      box-sizing: border-box;

    }


    body {

      margin: 0;

      padding: 30px;

      font-family:

        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background: #f3f4f6;

    }


    .container {

      max-width: 1100px;

      margin: auto;

    }


    h1 {

      text-align: center;

      margin-bottom: 10px;

    }


    .info {

      text-align: center;

      color: #666;

      margin-bottom: 30px;

    }


    /* =========================
       目前叫號
    ========================= */

    .current-call {

      background: white;

      padding: 30px;

      border-radius: 15px;

      text-align: center;

      margin-bottom: 25px;

      box-shadow:

        0 5px 20px rgba(0,0,0,.08);

    }


    .current-title {

      font-size: 18px;

      color: #666;

    }


    .current-number {

      font-size: 60px;

      font-weight: bold;

      margin-top: 10px;

      color: #111827;

    }


    /* =========================
       鎖定狀態
    ========================= */

    .lock-status {

      text-align: center;

      margin-bottom: 20px;

      font-size: 20px;

      font-weight: bold;

      min-height: 30px;

    }


    .lock-status.locked {

      color: #dc2626;

    }


    .lock-status.ready {

      color: #16a34a;

    }


    /* =========================
       控制按鈕
    ========================= */

    .controls {

      display: flex;

      justify-content: center;

      gap: 15px;

      margin-bottom: 25px;

      flex-wrap: wrap;

    }


    button {

      border: none;

      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;

      transition:

        opacity .2s,
        transform .15s;

    }


    button:hover:not(:disabled) {

      transform: translateY(-2px);

    }


    button:disabled {

      cursor: not-allowed;

      opacity: .5;

    }


    .refresh {

      padding: 12px 25px;

      background: #2563eb;

      color: white;

    }


    .reset {

      padding: 12px 25px;

      background: #dc2626;

      color: white;

    }


    /* =========================
       狀態文字
    ========================= */

    .status-message {

      text-align: center;

      margin-bottom: 20px;

      color: #666;

      min-height: 25px;

    }


    /* =========================
       號碼列表
    ========================= */

    .ticket-grid {

      display: grid;

      grid-template-columns:

        repeat(
          auto-fill,
          minmax(150px, 1fr)
        );

      gap: 15px;

    }


    .ticket {

      background: white;

      padding: 25px 15px;

      border-radius: 15px;

      font-size: 28px;

      font-weight: bold;

      box-shadow:

        0 5px 15px rgba(0,0,0,.08);

      transition:

        transform .15s,
        box-shadow .15s;

    }


    .ticket:hover:not(:disabled) {

      transform: translateY(-4px);

      box-shadow:

        0 10px 25px rgba(0,0,0,.15);

    }


    .ticket small {

      display: block;

      font-size: 14px;

      margin-top: 8px;

      font-weight: normal;

      color: #666;

    }


    /* =========================
       鎖定中的票券
    ========================= */

    .ticket.locked {

      background: #e5e7eb;

      color: #9ca3af;

    }


    .empty {

      text-align: center;

      color: #888;

      padding: 50px;

      grid-column: 1 / -1;

    }


    /* =========================
       手機版
    ========================= */

    @media (max-width: 600px) {

      body {

        padding: 15px;

      }


      .current-number {

        font-size: 45px;

      }


      .ticket-grid {

        grid-template-columns:

          repeat(
            2,
            1fr
          );

      }

    }

  </style>

</head>



<body>


<div class="container">


  <!-- =========================
       標題
  ========================= -->

  <h1>

    🎫 叫號管理後台

  </h1>


  <p class="info">

    點擊等待中的號碼即可進行叫號

  </p>



  <!-- =========================
       目前叫號
  ========================= -->

  <div class="current-call">


    <div class="current-title">

      目前叫號

    </div>


    <div
      id="currentNumber"
      class="current-number"
    >

      尚未叫號

    </div>


  </div>



  <!-- =========================
       鎖定倒數
  ========================= -->

  <div
    id="lockStatus"
    class="lock-status ready"
  >

    ● 系統可以叫號

  </div>



  <!-- =========================
       控制按鈕
  ========================= -->

  <div class="controls">


    <button
      class="refresh"
      onclick="manualRefresh()"
    >

      🔄 重新整理

    </button>


    <button
      class="reset"
      onclick="clearAllTickets()"
    >

      🗑️ 清空所有號碼

    </button>


  </div>



  <!-- =========================
       狀態訊息
  ========================= -->

  <div
    id="statusMessage"
    class="status-message"
  >

  </div>



  <!-- =========================
       等待號碼
  ========================= -->

  <h2>

    等待中的號碼

  </h2>


  <div
    id="ticketList"
    class="ticket-grid"
  >

  </div>


</div>



<script>


/* =================================
   Supabase 設定
================================= */


const SUPABASE_URL =

  "https://ubrjcadpfdfymbjwubfg.supabase.co";


const SUPABASE_KEY =

  "sb_publishable_0J9AWhVkRRYDehVffrmNdQ_jlOOqVAw";


const supabaseClient =

  supabase.createClient(

    SUPABASE_URL,

    SUPABASE_KEY

  );



/* =================================
   全域變數
================================= */


let ticketsCache = [];


/* 資料庫鎖定到期時間 */

let lockUntil = null;


/* 倒數計時器 */

let countdownTimer = null;


/* 避免同一台電腦重複送出 */

let callingInProgress = false;



/* =================================
   取得 queue_settings
================================= */


async function getQueueSettings() {


  const {

    data,

    error

  } = await supabaseClient

    .from("queue_settings")

    .select("*")

    .limit(1)

    .maybeSingle();


  if (error) {

    console.error(
      "讀取 queue_settings 失敗：",
      error
    );


    return null;

  }


  return data;

}



/* =================================
   讀取目前叫號
================================= */


async function loadCurrentNumber() {


  const data =

    await getQueueSettings();


  const currentNumberElement =

    document.getElementById(
      "currentNumber"
    );


  if (

    data &&
    data.current_number

  ) {

    currentNumberElement.textContent =

      data.current_number;

  }

  else {

    currentNumberElement.textContent =

      "尚未叫號";

  }



  /* 更新鎖定狀態 */

  if (

    data &&
    data.call_lock_until

  ) {

    lockUntil =

      new Date(
        data.call_lock_until
      );

  }

  else {

    lockUntil = null;

  }


  updateLockStatus();

}



/* =================================
   讀取等待中的號碼
================================= */


async function loadTickets() {


  const ticketList =

    document.getElementById(
      "ticketList"
    );


  const statusMessage =

    document.getElementById(
      "statusMessage"
    );


  statusMessage.textContent =

    "載入中...";


  const {

    data,

    error

  } = await supabaseClient

    .from("tickets")

    .select("*")

    .eq(

      "status",

      "waiting"

    )

    .order(

      "ticket_number",

      {

        ascending: true

      }

    );


  if (error) {


    console.error(error);


    ticketList.innerHTML = `

      <div class="empty">

        ❌ 讀取資料失敗

        <br><br>

        ${error.message}

      </div>

    `;


    statusMessage.textContent =

      "";


    return;

  }



  ticketsCache = data;


  renderTickets();



  statusMessage.textContent =

    `目前共有 ${data.length} 位等待中`;



}



/* =================================
   顯示號碼按鈕
================================= */


function renderTickets() {


  const ticketList =

    document.getElementById(
      "ticketList"
    );


  ticketList.innerHTML =

    "";


  if (

    ticketsCache.length === 0

  ) {


    ticketList.innerHTML = `

      <div class="empty">

        目前沒有等待中的號碼

      </div>

    `;


    return;

  }



  const isLocked =

    isSystemLocked();



  ticketsCache.forEach(

    ticket => {


      const button =

        document.createElement(
          "button"
        );


      button.className =

        "ticket";


      if (isLocked) {

        button.classList.add(
          "locked"
        );

      }


      button.disabled =

        isLocked ||
        callingInProgress;


      button.innerHTML = `

        ${ticket.display_number}

        <small>

          ${

            isLocked

              ? "系統暫時鎖定中 ⏳"

              : "點擊叫號 🔊"

          }

        </small>

      `;


      button.addEventListener(

        "click",

        () => callTicket(ticket)

      );


      ticketList.appendChild(
        button
      );


    }

  );


}



/* =================================
   判斷系統是否鎖定
================================= */


function isSystemLocked() {


  if (!lockUntil) {

    return false;

  }


  const now =

    new Date();


  return lockUntil > now;

}



/* =================================
   更新鎖定倒數
================================= */


function updateLockStatus() {


  const lockStatus =

    document.getElementById(
      "lockStatus"
    );


  const now =

    new Date();


  if (

    lockUntil &&
    lockUntil > now

  ) {


    const milliseconds =

      lockUntil - now;


    const seconds =

      Math.ceil(
        milliseconds / 1000
      );


    lockStatus.className =

      "lock-status locked";


    lockStatus.textContent =

      `🔒 系統叫號鎖定中，${seconds} 秒後可再次叫號`;


    renderTickets();


  }

  else {


    lockUntil = null;


    lockStatus.className =

      "lock-status ready";


    lockStatus.textContent =

      "● 系統可以叫號";


    renderTickets();


  }

}



/* =================================
   啟動倒數計時器
================================= */


function startCountdown() {


  if (countdownTimer) {

    clearInterval(
      countdownTimer
    );

  }


  updateLockStatus();


  countdownTimer =

    setInterval(

      () => {


        updateLockStatus();


        if (

          !isSystemLocked()

        ) {


          clearInterval(
            countdownTimer
          );


          countdownTimer = null;

        }


      },

      200

    );

}



/* =================================
   叫號
================================= */


async function callTicket(ticket) {


  /* 本機防止重複點擊 */

  if (callingInProgress) {

    return;

  }



  /* 先檢查目前鎖定 */

  if (isSystemLocked()) {

    updateLockStatus();

    return;

  }



  const confirmed =

    confirm(

      `確定要叫號 ${ticket.display_number} 嗎？`

    );


  if (!confirmed) {

    return;

  }



  callingInProgress = true;


  renderTickets();



  const statusMessage =

    document.getElementById(
      "statusMessage"
    );


  statusMessage.textContent =

    `正在叫號 ${ticket.display_number}...`;



  try {


    const {

      data,

      error

    } = await supabaseClient.rpc(

      "call_ticket",

      {

        target_ticket_id:

          ticket.id

      }

    );



    if (error) {

      throw error;

    }



    /*
      RPC 有正常回傳，
      但資料庫拒絕叫號
    */

    if (

      !data ||
      data.success === false

    ) {


      if (

        data &&
        data.lock_until

      ) {


        lockUntil =

          new Date(
            data.lock_until
          );


        startCountdown();

      }


      alert(

        data?.message ||

        "叫號失敗"

      );


      return;

    }



    /* =============================
       叫號成功
    ============================= */


    document
      .getElementById(
        "currentNumber"
      )
      .textContent =

      data.display_number ||
      ticket.display_number;



    /* 設定鎖定時間 */

    if (

      data.lock_until

    ) {


      lockUntil =

        new Date(
          data.lock_until
        );


      startCountdown();

    }



    statusMessage.textContent =

      `🔊 已叫號 ${ticket.display_number}`;



    /* 重新讀取號碼 */

    await loadTickets();


  }


  catch (error) {


    console.error(
      "叫號失敗：",
      error
    );


    alert(

      "叫號失敗：\n" +

      error.message

    );


  }


  finally {


    callingInProgress =

      false;


    renderTickets();

  }


}



/* =================================
   手動重新整理
================================= */


async function manualRefresh() {


  await loadCurrentNumber();


  await loadTickets();


}



/* =================================
   清空所有號碼
================================= */


async function clearAllTickets() {


  const confirmed =

    confirm(

      "⚠️ 確定要清空目前所有號碼嗎？\n\n清空後下一個號碼將重新從 A001 開始。"

    );


  if (!confirmed) {

    return;

  }



  const {

    error

  } = await supabaseClient.rpc(

    "clear_all_tickets"

  );


  if (error) {


    console.error(error);


    alert(

      "清空失敗：\n" +

      error.message

    );


    return;

  }



  document
    .getElementById(
      "currentNumber"
    )
    .textContent =

    "尚未叫號";


  lockUntil = null;


  updateLockStatus();



  await loadTickets();


  alert(

    "✅ 所有號碼已成功清空"

  );


}



/* =================================
   Tickets 即時同步
================================= */


supabaseClient

  .channel(

    "tickets-channel"

  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "tickets"

    },

    () => {


      loadTickets();


    }

  )

  .subscribe();



/* =================================
   queue_settings 即時同步
================================= */


supabaseClient

  .channel(

    "queue-settings-channel"

  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "queue_settings"

    },

    () => {


      loadCurrentNumber();


    }

  )

  .subscribe();



/* =================================
   定期同步鎖定狀態
================================= */


setInterval(

  async () => {


    if (

      !isSystemLocked()

    ) {


      await loadCurrentNumber();

    }


  },

  1000

);



/* =================================
   網頁啟動
================================= */


loadCurrentNumber();


loadTickets();


</script>


</body>

</html>
