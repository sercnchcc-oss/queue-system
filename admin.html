<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>叫號管理後台</title>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 30px;

      font-family:

        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background: #f3f4f6;

    }


    .container {

      max-width: 1000px;

      margin: auto;

    }


    h1 {

      text-align: center;

      margin-bottom: 10px;

    }


    .info {

      text-align: center;

      color: #666;

      margin-bottom: 30px;

    }


    /* =========================
       目前叫號
    ========================= */

    .current-call {

      background: white;

      padding: 25px;

      border-radius: 15px;

      text-align: center;

      margin-bottom: 20px;

      box-shadow:

        0 5px 20px rgba(0,0,0,.08);

    }


    .current-number {

      font-size: 48px;

      font-weight: bold;

      margin-top: 10px;

    }


    /* =========================
       鎖定狀態
    ========================= */

    .lock-status {

      background: #fff7ed;

      border: 2px solid #fb923c;

      color: #c2410c;

      padding: 15px;

      border-radius: 12px;

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 20px;

      display: none;

    }


    .lock-status.active {

      display: block;

    }


    /* =========================
       控制按鈕
    ========================= */

    .controls {

      display: flex;

      justify-content: center;

      gap: 15px;

      margin-bottom: 25px;

      flex-wrap: wrap;

    }


    button {

      border: none;

      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;

    }


    .refresh {

      padding: 12px 25px;

      background: #2563eb;

      color: white;

    }


    .reset {

      padding: 12px 25px;

      background: #dc2626;

      color: white;

    }


    .refresh:hover {

      opacity: .85;

    }


    .reset:hover {

      opacity: .85;

    }


    /* =========================
       狀態訊息
    ========================= */

    .status-message {

      text-align: center;

      margin-bottom: 15px;

      color: #666;

    }


    /* =========================
       號碼列表
    ========================= */

    .ticket-grid {

      display: grid;

      grid-template-columns:

        repeat(
          auto-fill,
          minmax(150px, 1fr)
        );

      gap: 15px;

    }


    .ticket {

      background: white;

      padding: 25px 15px;

      border-radius: 15px;

      cursor: pointer;

      font-size: 28px;

      font-weight: bold;

      box-shadow:

        0 5px 15px rgba(0,0,0,.08);

      transition:

        transform .15s,
        box-shadow .15s;

    }


    .ticket:hover:not(:disabled) {

      transform: translateY(-4px);

      box-shadow:

        0 10px 25px rgba(0,0,0,.15);

    }


    .ticket:disabled {

      cursor: not-allowed;

      opacity: .45;

      transform: none;

    }


    .ticket small {

      display: block;

      font-size: 14px;

      margin-top: 8px;

      font-weight: normal;

      color: #666;

    }


    .empty {

      text-align: center;

      color: #888;

      padding: 50px;

      grid-column: 1 / -1;

    }


  </style>

</head>


<body>


<div class="container">


  <h1>
    🎫 叫號管理後台
  </h1>


  <p class="info">

    點擊等待中的號碼即可進行叫號

  </p>


  <!-- =========================
       目前叫號
  ========================= -->

  <div class="current-call">


    <div>
      目前叫號
    </div>


    <div
      id="currentNumber"
      class="current-number"
    >

      尚未叫號

    </div>


  </div>


  <!-- =========================
       鎖定倒數
  ========================= -->

  <div
    id="lockStatus"
    class="lock-status"
  >

    🔒 正在叫號中，請等待

  </div>


  <!-- =========================
       控制按鈕
  ========================= -->

  <div class="controls">


    <button
      class="refresh"
      onclick="refreshAll()"
    >

      🔄 重新整理

    </button>


    <button
      class="reset"
      onclick="clearAllTickets()"
    >

      🗑️ 清空所有號碼

    </button>


  </div>


  <!-- 狀態 -->

  <div
    id="statusMessage"
    class="status-message"
  >
  </div>


  <h2>
    等待中的號碼
  </h2>


  <div
    id="ticketList"
    class="ticket-grid"
  >
  </div>


</div>



<script>


/* =================================
   Supabase 設定
================================= */

const SUPABASE_URL =
  "https://ubrjcadpfdfymbjwubfg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_0J9AWhVkRRYDehVffrmNdQ_jlOOqVAw";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =================================
   全域變數
================================= */


let callLockUntil = null;


let countdownTimer = null;


let isCalling = false;



/* =================================
   取得目前活動
================================= */

async function getActiveEventId() {


  const {

    data,

    error

  } = await supabaseClient

    .from("events")

    .select("id")

    .eq(
      "is_active",
      true
    )

    .order(
      "created_at",
      {
        ascending: false
      }
    )

    .limit(1)

    .maybeSingle();


  if (error) {

    console.error(
      "取得活動失敗：",
      error
    );

    return null;

  }


  return data?.id || null;

}



/* =================================
   判斷目前是否鎖定
================================= */

function isLocked() {


  if (!callLockUntil) {

    return false;

  }


  const lockTime =
    new Date(callLockUntil).getTime();


  return lockTime > Date.now();

}



/* =================================
   更新所有號碼按鈕狀態
================================= */

function updateTicketButtons() {


  const locked =
    isLocked() || isCalling;


  document
    .querySelectorAll(".ticket")
    .forEach(
      button => {

        button.disabled =
          locked;

      }
    );

}



/* =================================
   開始倒數
================================= */

function startCountdown(lockUntil) {


  callLockUntil =
    lockUntil;


  const lockStatus =
    document.getElementById(
      "lockStatus"
    );


  lockStatus.classList.add(
    "active"
  );


  if (countdownTimer) {

    clearInterval(
      countdownTimer
    );

  }


  function updateCountdown() {


    const remaining =
      new Date(
        callLockUntil
      ).getTime()
      -
      Date.now();


    if (remaining <= 0) {


      callLockUntil =
        null;


      lockStatus.classList.remove(
        "active"
      );


      clearInterval(
        countdownTimer
      );


      countdownTimer =
        null;


      updateTicketButtons();


      return;

    }


    const seconds =
      Math.ceil(
        remaining / 1000
      );


    lockStatus.textContent =
      `🔒 正在叫號中，請等待 ${seconds} 秒`;


    updateTicketButtons();

  }


  updateCountdown();


  countdownTimer =
    setInterval(
      updateCountdown,
      200
    );

}



/* =================================
   解除鎖定
================================= */

function clearLock() {


  callLockUntil =
    null;


  if (countdownTimer) {

    clearInterval(
      countdownTimer
    );

    countdownTimer =
      null;

  }


  document
    .getElementById(
      "lockStatus"
    )
    .classList.remove(
      "active"
    );


  updateTicketButtons();

}



/* =================================
   讀取等待中的號碼
================================= */

async function loadTickets() {


  const ticketList =
    document.getElementById(
      "ticketList"
    );


  const statusMessage =
    document.getElementById(
      "statusMessage"
    );


  ticketList.innerHTML =
    "";


  statusMessage.textContent =
    "載入中...";


  const activeEventId =
    await getActiveEventId();


  if (!activeEventId) {

    statusMessage.textContent =
      "目前沒有啟用中的活動";

    return;

  }


  const {

    data,

    error

  } = await supabaseClient

    .from("tickets")

    .select("*")

    .eq(
      "event_id",
      activeEventId
    )

    .eq(
      "status",
      "waiting"
    )

    .order(
      "ticket_number",
      {
        ascending: true
      }
    );


  if (error) {


    console.error(error);


    ticketList.innerHTML = `

      <div class="empty">

        ❌ 讀取資料失敗

        <br><br>

        ${error.message}

      </div>

    `;


    statusMessage.textContent =
      "";


    return;

  }



  ticketList.innerHTML =
    "";


  statusMessage.textContent =
    `目前共有 ${data.length} 位等待中`;



  if (data.length === 0) {


    ticketList.innerHTML = `

      <div class="empty">

        目前沒有等待中的號碼

      </div>

    `;


    return;

  }



  data.forEach(
    ticket => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "ticket";


      button.innerHTML = `

        ${ticket.display_number}

        <small>
          點擊叫號 🔊
        </small>

      `;


      button.disabled =
        isLocked() || isCalling;


      button.addEventListener(

        "click",

        () => callTicket(ticket)

      );


      ticketList.appendChild(
        button
      );


    }
  );


}



/* =================================
   讀取目前叫號與鎖定狀態
================================= */

async function loadCurrentNumber() {


  const activeEventId =
    await getActiveEventId();


  if (!activeEventId) {

    return;

  }


  const {

    data,

    error

  } = await supabaseClient

    .from("queue_settings")

    .select("*")

    .eq(
      "event_id",
      activeEventId
    )

    .maybeSingle();



  if (error) {

    console.error(
      "讀取目前叫號失敗：",
      error
    );

    return;

  }



  const currentNumberElement =
    document.getElementById(
      "currentNumber"
    );



  if (

    data &&
    data.current_number

  ) {

    currentNumberElement.textContent =
      data.current_number;

  }

  else {

    currentNumberElement.textContent =
      "尚未叫號";

  }



  /*
    同步資料庫鎖定時間
  */

  if (

    data &&
    data.call_lock_until

  ) {


    const lockTime =
      new Date(
        data.call_lock_until
      ).getTime();



    if (lockTime > Date.now()) {


      startCountdown(
        data.call_lock_until
      );

    }

    else {


      clearLock();

    }


  }

  else {


    clearLock();

  }


}



/* =================================
   叫號
================================= */

async function callTicket(ticket) {


  /*
    前端先判斷
  */

  if (

    isLocked() ||
    isCalling

  ) {

    return;

  }



  const confirmed =
    confirm(
      `確定要叫號 ${ticket.display_number} 嗎？`
    );


  if (!confirmed) {

    return;

  }



  /*
    立即鎖定目前設備
  */

  isCalling =
    true;


  updateTicketButtons();



  const {

    data,

    error

  } = await supabaseClient.rpc(

    "call_ticket",

    {

      target_ticket_id:
        ticket.id

    }

  );



  isCalling =
    false;



  if (error) {


    console.error(error);


    alert(
      "叫號失敗：\n" +
      error.message
    );


    updateTicketButtons();


    return;

  }



  /*
    RPC 回傳 TABLE
    所以 data 是陣列
  */

  const result =
    data?.[0];



  if (!result) {


    alert(
      "叫號失敗：沒有收到伺服器回應"
    );


    updateTicketButtons();


    return;

  }



  /*
    資料庫拒絕叫號
    例如其他設備剛剛先叫號
  */

  if (!result.success) {


    if (result.lock_until) {


      startCountdown(
        result.lock_until
      );

    }


    alert(
      result.message ||
      "目前無法叫號"
    );


    await refreshAll();


    return;

  }



  /*
    叫號成功
  */

  document
    .getElementById(
      "currentNumber"
    )
    .textContent =
      result.current_number;



  /*
    開始 3 秒鎖定
  */

  if (result.lock_until) {


    startCountdown(
      result.lock_until
    );

  }



  /*
    更新等待列表
  */

  await loadTickets();


}



/* =================================
   清空所有號碼
================================= */

async function clearAllTickets() {


  /*
    鎖定期間禁止清空
  */

  if (isLocked()) {

    alert(
      "目前正在叫號中，請等待倒數結束"
    );

    return;

  }



  const confirmed =
    confirm(

      "⚠️ 確定要清空目前所有號碼嗎？\n\n" +

      "清空後下一個號碼將重新從 A001 開始。"

    );


  if (!confirmed) {

    return;

  }



  const {

    error

  } = await supabaseClient.rpc(

    "clear_all_tickets"

  );


  if (error) {


    console.error(error);


    alert(

      "清空失敗：" +

      error.message

    );


    return;

  }



  document
    .getElementById(
      "currentNumber"
    )
    .textContent =
      "尚未叫號";


  clearLock();


  await loadTickets();


  await loadCurrentNumber();



  alert(
    "✅ 所有號碼已成功清空"
  );


}



/* =================================
   全部重新整理
================================= */

async function refreshAll() {


  await Promise.all(

    [

      loadTickets(),

      loadCurrentNumber()

    ]

  );


}



/* =================================
   Tickets 即時同步
================================= */

supabaseClient

  .channel(
    "tickets-channel"
  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "tickets"

    },

    () => {


      loadTickets();


    }

  )

  .subscribe();



/* =================================
   Queue Settings 即時同步

   所有後台設備的鎖定狀態
   都從這裡同步
================================= */

supabaseClient

  .channel(
    "queue-settings-channel"
  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "queue_settings"

    },

    payload => {


      const data =
        payload.new;


      /*
        更新目前叫號
      */

      if (

        data &&
        data.current_number

      ) {


        document
          .getElementById(
            "currentNumber"
          )
          .textContent =
            data.current_number;

      }



      /*
        同步鎖定倒數
      */

      if (

        data &&
        data.call_lock_until

      ) {


        const lockTime =
          new Date(
            data.call_lock_until
          ).getTime();



        if (

          lockTime >
          Date.now()

        ) {


          startCountdown(
            data.call_lock_until
          );

        }

        else {


          clearLock();

        }


      }


      /*
        更新等待號碼
      */

      loadTickets();


    }

  )

  .subscribe();



/* =================================
   網頁啟動
================================= */

refreshAll();


</script>


</body>

</html>
