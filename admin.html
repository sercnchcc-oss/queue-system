<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>叫號管理台</title>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* ============================================================
   基本設定
============================================================ */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 30px;

    font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

    background: #f4f6f9;

    color: #222;

}


/* ============================================================
   主容器
============================================================ */

.container {

    max-width: 1000px;

    margin: auto;

}


/* ============================================================
   標題
============================================================ */

h1 {

    text-align: center;

    margin-bottom: 30px;

}


/* ============================================================
   目前叫號
============================================================ */

.current-card {

    background: white;

    border-radius: 18px;

    padding: 30px;

    text-align: center;

    box-shadow:
        0 4px 20px rgba(0,0,0,0.08);

}


.current-label {

    font-size: 18px;

    color: #666;

}


.current-number {

    font-size: 64px;

    font-weight: bold;

    margin-top: 15px;

    letter-spacing: 3px;

}


/* ============================================================
   系統狀態
============================================================ */

.system-status {

    text-align: center;

    margin-top: 25px;

    font-size: 18px;

    font-weight: bold;

}


.status-ready {

    color: #15803d;

}


.status-lock {

    color: #dc2626;

}


/* ============================================================
   倒數
============================================================ */

.countdown {

    text-align: center;

    margin-top: 10px;

    font-size: 20px;

    font-weight: bold;

    color: #dc2626;

}


/* ============================================================
   控制按鈕
============================================================ */

.controls {

    display: flex;

    justify-content: center;

    gap: 15px;

    margin-top: 25px;

    flex-wrap: wrap;

}


button {

    border: none;

    border-radius: 10px;

    padding: 14px 24px;

    font-size: 16px;

    cursor: pointer;

    transition: 0.2s;

}


button:hover {

    transform: translateY(-2px);

}


button:disabled {

    opacity: 0.45;

    cursor: not-allowed;

    transform: none;

}


/* ============================================================
   重新整理
============================================================ */

.refresh-btn {

    background: #2563eb;

    color: white;

}


/* ============================================================
   清空
============================================================ */

.clear-btn {

    background: #dc2626;

    color: white;

}


/* ============================================================
   等待號碼區
============================================================ */

.queue-section {

    margin-top: 50px;

}


.queue-title {

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 20px;

}


/* ============================================================
   號碼列表
============================================================ */

.ticket-list {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));

    gap: 15px;

}


/* ============================================================
   號碼卡片
============================================================ */

.ticket-card {

    background: white;

    border-radius: 15px;

    padding: 25px 15px;

    text-align: center;

    cursor: pointer;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);

    transition: 0.2s;

}


.ticket-card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 8px 20px rgba(0,0,0,0.15);

}


.ticket-card.disabled {

    opacity: 0.4;

    pointer-events: none;

}


/* ============================================================
   號碼文字
============================================================ */

.ticket-number {

    font-size: 28px;

    font-weight: bold;

}


/* ============================================================
   說明文字
============================================================ */

.ticket-action {

    margin-top: 10px;

    color: #666;

    font-size: 14px;

}


/* ============================================================
   沒有等待號碼
============================================================ */

.empty {

    text-align: center;

    color: #888;

    padding: 40px;

    background: white;

    border-radius: 15px;

}

</style>

</head>


<body>


<div class="container">


<!-- ============================================================
     標題
============================================================ -->

<h1>叫號管理台</h1>



<!-- ============================================================
     目前叫號
============================================================ -->

<div class="current-card">

    <div class="current-label">

        目前叫號

    </div>


    <div
        id="currentNumber"
        class="current-number">

        尚未叫號

    </div>

</div>



<!-- ============================================================
     系統狀態
============================================================ -->

<div
    id="systemStatus"
    class="system-status status-ready">

    ● 系統可以叫號

</div>



<!-- ============================================================
     倒數
============================================================ -->

<div
    id="countdown"
    class="countdown">

</div>



<!-- ============================================================
     控制按鈕
============================================================ -->

<div class="controls">


    <button
        class="refresh-btn"
        onclick="loadQueue()">

        🔄 重新整理

    </button>



    <button
        id="clearButton"
        class="clear-btn"
        onclick="clearAllTickets()">

        🗑 清空所有號碼

    </button>


</div>



<!-- ============================================================
     等待號碼
============================================================ -->

<div class="queue-section">


    <div class="queue-title">

        等待中的號碼

    </div>


    <div
        id="ticketList"
        class="ticket-list">

    </div>


</div>


</div>



<script>


/* ============================================================
   Supabase 設定
============================================================ */


/* ⚠️ 改成你的 Supabase URL */

const SUPABASE_URL =
    '你的_SUPABASE_URL';


/* ⚠️ 改成你的 Supabase ANON KEY */

const SUPABASE_ANON_KEY =
    '你的_SUPABASE_ANON_KEY';



/* ============================================================
   建立 Supabase Client
============================================================ */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );



/* ============================================================
   Event ID

   如果你的系統目前只有一個活動，
   這裡會自動從 tickets 取得 Event ID
============================================================ */

let currentEventId = null;



/* ============================================================
   系統鎖定時間
============================================================ */

let callLockUntil = null;



/* ============================================================
   倒數 Timer
============================================================ */

let countdownTimer = null;



/* ============================================================
   是否正在執行叫號
============================================================ */

let isCalling = false;



/* ============================================================
   載入 Queue
============================================================ */

async function loadQueue() {


    try {


        /* --------------------------------------------------------
           取得等待中的號碼
        -------------------------------------------------------- */

        const {

            data: tickets,

            error: ticketError

        } = await supabaseClient
            .from('tickets')
            .select('*')
            .eq('status', 'waiting')
            .order('ticket_number', {
                ascending: true
            });


        if (ticketError) {

            throw ticketError;

        }



        /* --------------------------------------------------------
           如果有等待號碼
           取得 Event ID
        -------------------------------------------------------- */

        if (
            tickets &&
            tickets.length > 0
        ) {

            currentEventId =
                tickets[0].event_id;

        }



        /* --------------------------------------------------------
           如果沒有 Event ID
           嘗試從 queue_settings 取得
        -------------------------------------------------------- */

        if (!currentEventId) {


            const {

                data: settingsList,

                error: settingsError

            } = await supabaseClient
                .from('queue_settings')
                .select('*')
                .limit(1);


            if (settingsError) {

                throw settingsError;

            }


            if (
                settingsList &&
                settingsList.length > 0
            ) {

                currentEventId =
                    settingsList[0].event_id;

            }

        }



        /* --------------------------------------------------------
           載入目前叫號設定
        -------------------------------------------------------- */

        if (currentEventId) {

            await loadSettings();

        }



        /* --------------------------------------------------------
           顯示等待號碼
        -------------------------------------------------------- */

        renderTickets(
            tickets || []
        );


    }

    catch (error) {

        console.error(error);

        alert(
            '讀取資料失敗：' +
            error.message
        );

    }

}



/* ============================================================
   載入目前設定
============================================================ */

async function loadSettings() {


    if (!currentEventId) {

        return;

    }



    const {

        data,

        error

    } = await supabaseClient
        .from('queue_settings')
        .select('*')
        .eq(
            'event_id',
            currentEventId
        )
        .single();



    if (error) {

        console.error(error);

        return;

    }



    /* --------------------------------------------------------
       顯示目前叫號
    -------------------------------------------------------- */

    const currentNumber =
        document.getElementById(
            'currentNumber'
        );


    if (data.current_number) {

        currentNumber.textContent =
            data.current_number;

    }
    else {

        currentNumber.textContent =
            '尚未叫號';

    }



    /* --------------------------------------------------------
       取得鎖定時間
    -------------------------------------------------------- */

    callLockUntil =
        data.call_lock_until;


    updateLockStatus();

}



/* ============================================================
   顯示等待號碼
============================================================ */

function renderTickets(tickets) {


    const ticketList =
        document.getElementById(
            'ticketList'
        );


    ticketList.innerHTML = '';



    /* --------------------------------------------------------
       沒有等待號碼
    -------------------------------------------------------- */

    if (tickets.length === 0) {


        ticketList.innerHTML = `

            <div class="empty">

                目前沒有等待中的號碼

            </div>

        `;


        return;

    }



    /* --------------------------------------------------------
       建立號碼卡片
    -------------------------------------------------------- */

    tickets.forEach(ticket => {


        const card =
            document.createElement('div');


        card.className =
            'ticket-card';


        card.innerHTML = `

            <div class="ticket-number">

                ${ticket.display_number}

            </div>


            <div class="ticket-action">

                點擊叫號 🔊

            </div>

        `;



        /* ----------------------------------------------------
           點擊叫號
        ---------------------------------------------------- */

        card.addEventListener(
            'click',
            () => {

                callTicket(
                    ticket.id
                );

            }
        );


        ticketList.appendChild(
            card
        );


    });


    updateTicketButtons();

}



/* ============================================================
   叫號
============================================================ */

async function callTicket(ticketId) {


    /* --------------------------------------------------------
       本機正在叫號
    -------------------------------------------------------- */

    if (isCalling) {

        return;

    }



    /* --------------------------------------------------------
       檢查鎖定
    -------------------------------------------------------- */

    if (isSystemLocked()) {

        alert(
            '系統正在叫號中，請稍後再試'
        );

        return;

    }



    /* --------------------------------------------------------
       找出號碼
    -------------------------------------------------------- */

    const {

        data: ticket,

        error: ticketError

    } = await supabaseClient
        .from('tickets')
        .select('*')
        .eq(
            'id',
            ticketId
        )
        .single();



    if (ticketError) {

        alert(
            '找不到此號碼'
        );

        return;

    }



    /* --------------------------------------------------------
       確認
    -------------------------------------------------------- */

    const confirmCall =
        confirm(
            `確定要叫號 ${ticket.display_number} 嗎？`
        );


    if (!confirmCall) {

        return;

    }



    isCalling = true;


    updateTicketButtons();



    try {


        /* ----------------------------------------------------
           呼叫 RPC

           ⚠️ 這裡一定是 p_ticket_id
           必須和 SQL Function 完全一致
        ---------------------------------------------------- */

        const {

            data,

            error

        } = await supabaseClient.rpc(
            'call_ticket',
            {

                p_ticket_id: ticketId

            }
        );



        if (error) {

            throw error;

        }



        /* ----------------------------------------------------
           設定鎖定時間
        ---------------------------------------------------- */

        if (
            data &&
            data.call_lock_until
        ) {

            callLockUntil =
                data.call_lock_until;

        }



        /* ----------------------------------------------------
           立即更新畫面
        ---------------------------------------------------- */

        await loadQueue();


        updateLockStatus();


    }

    catch (error) {


        console.error(error);


        alert(
            '叫號失敗：' +
            error.message
        );


        await loadQueue();


    }

    finally {


        isCalling = false;


        updateTicketButtons();

    }

}



/* ============================================================
   判斷系統是否鎖定
============================================================ */

function isSystemLocked() {


    if (!callLockUntil) {

        return false;

    }


    const now =
        new Date();


    const lockTime =
        new Date(
            callLockUntil
        );


    return lockTime > now;

}



/* ============================================================
   更新鎖定狀態
============================================================ */

function updateLockStatus() {


    const status =
        document.getElementById(
            'systemStatus'
        );


    const countdown =
        document.getElementById(
            'countdown'
        );


    const clearButton =
        document.getElementById(
            'clearButton'
        );



    /* --------------------------------------------------------
       清除舊 Timer
    -------------------------------------------------------- */

    if (countdownTimer) {

        clearInterval(
            countdownTimer
        );

    }



    /* --------------------------------------------------------
       如果沒有鎖定
    -------------------------------------------------------- */

    if (!isSystemLocked()) {


        status.textContent =
            '● 系統可以叫號';


        status.className =
            'system-status status-ready';


        countdown.textContent =
            '';


        clearButton.disabled =
            false;


        updateTicketButtons();


        return;

    }



    /* --------------------------------------------------------
       系統鎖定
    -------------------------------------------------------- */

    status.textContent =
        '● 系統正在叫號中';


    status.className =
        'system-status status-lock';


    clearButton.disabled =
        true;



    /* --------------------------------------------------------
       倒數更新
    -------------------------------------------------------- */

    function updateCountdown() {


        const now =
            new Date();


        const lockTime =
            new Date(
                callLockUntil
            );


        const diff =
            lockTime - now;



        /* ----------------------------------------------------
           倒數結束
        ---------------------------------------------------- */

        if (diff <= 0) {


            countdown.textContent =
                '';


            clearInterval(
                countdownTimer
            );


            status.textContent =
                '● 系統可以叫號';


            status.className =
                'system-status status-ready';


            clearButton.disabled =
                false;


            updateTicketButtons();


            return;

        }



        /* ----------------------------------------------------
           顯示秒數
        ---------------------------------------------------- */

        const seconds =
            (diff / 1000)
                .toFixed(1);


        countdown.textContent =
            `系統鎖定中 ${seconds} 秒`;

    }



    updateCountdown();



    countdownTimer =
        setInterval(
            updateCountdown,
            100
        );


    updateTicketButtons();

}



/* ============================================================
   更新號碼按鈕
============================================================ */

function updateTicketButtons() {


    const cards =
        document.querySelectorAll(
            '.ticket-card'
        );


    const locked =
        isCalling ||
        isSystemLocked();



    cards.forEach(card => {


        if (locked) {

            card.classList.add(
                'disabled'
            );

        }
        else {

            card.classList.remove(
                'disabled'
            );

        }

    });

}



/* ============================================================
   清空所有號碼
============================================================ */

async function clearAllTickets() {


    if (!currentEventId) {


        alert(
            '目前找不到活動資料'
        );


        return;

    }



    if (isSystemLocked()) {


        alert(
            '系統正在叫號中，暫時無法清空'
        );


        return;

    }



    const confirmed =
        confirm(
            '確定要清空所有號碼嗎？此操作無法復原。'
        );



    if (!confirmed) {

        return;

    }



    try {


        const {

            data,

            error

        } = await supabaseClient.rpc(
            'clear_all_tickets',
            {

                p_event_id:
                    currentEventId

            }
        );



        if (error) {

            throw error;

        }



        alert(
            '所有號碼已清空'
        );


        await loadQueue();


    }

    catch (error) {


        console.error(error);


        alert(
            '清空失敗：' +
            error.message
        );

    }

}



/* ============================================================
   定時同步

   每秒重新確認資料庫狀態

   所以其他設備叫號後，
   這台設備最多約 1 秒就會同步鎖定
============================================================ */

setInterval(
    async () => {

        if (currentEventId) {

            await loadSettings();

        }

    },
    1000
);



/* ============================================================
   初始載入
============================================================ */

loadQueue();


</script>


</body>

</html>
