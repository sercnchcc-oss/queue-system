<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>叫號管理後台</title>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 30px;

      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      background: #f3f4f6;

    }


    .container {

      max-width: 1000px;

      margin: auto;

    }


    h1 {

      text-align: center;

      margin-bottom: 10px;

    }


    .info {

      text-align: center;

      color: #666;

      margin-bottom: 25px;

    }


    /* =========================
       目前叫號
    ========================= */

    .current-call {

      background: white;

      padding: 25px;

      border-radius: 15px;

      text-align: center;

      margin-bottom: 20px;

      box-shadow:
        0 5px 20px rgba(0,0,0,.08);

    }


    .current-title {

      font-size: 16px;

      color: #666;

    }


    .current-number {

      font-size: 48px;

      font-weight: bold;

      margin-top: 10px;

    }


    /* =========================
       系統狀態
    ========================= */

    .system-status {

      text-align: center;

      font-size: 16px;

      font-weight: bold;

      margin-bottom: 20px;

    }


    .system-ready {

      color: #15803d;

    }


    .system-locked {

      color: #dc2626;

    }


    /* =========================
       控制按鈕
    ========================= */

    .controls {

      display: flex;

      justify-content: center;

      gap: 15px;

      margin-bottom: 20px;

      flex-wrap: wrap;

    }


    button {

      border: none;

      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;

      transition:
        opacity .2s,
        transform .15s;

    }


    button:hover:not(:disabled) {

      opacity: .88;

      transform: translateY(-2px);

    }


    button:disabled {

      cursor: not-allowed;

      opacity: .5;

    }


    .refresh {

      padding: 12px 25px;

      background: #2563eb;

      color: white;

    }


    .reset {

      padding: 12px 25px;

      background: #dc2626;

      color: white;

    }


    /* =========================
       狀態文字
    ========================= */

    .status-message {

      text-align: center;

      margin-bottom: 20px;

      color: #666;

      min-height: 24px;

    }


    /* =========================
       號碼列表
    ========================= */

    .ticket-grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));

      gap: 15px;

    }


    .ticket {

      background: white;

      padding: 25px 15px;

      border-radius: 15px;

      cursor: pointer;

      font-size: 28px;

      font-weight: bold;

      box-shadow:
        0 5px 15px rgba(0,0,0,.08);

      transition:
        transform .15s,
        box-shadow .15s;

    }


    .ticket:hover:not(:disabled) {

      transform: translateY(-4px);

      box-shadow:
        0 10px 25px rgba(0,0,0,.15);

    }


    .ticket small {

      display: block;

      font-size: 14px;

      margin-top: 8px;

      font-weight: normal;

      color: #666;

    }


    .empty {

      text-align: center;

      color: #888;

      padding: 50px;

      grid-column: 1 / -1;

    }


    /* =========================
       鎖定時的畫面效果
    ========================= */

    .locked-overlay {

      opacity: .55;

    }


    @media (max-width: 600px) {

      body {

        padding: 15px;

      }


      .current-number {

        font-size: 40px;

      }


    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    🎫 叫號管理後台
  </h1>


  <p class="info">

    點擊等待中的號碼即可進行叫號

  </p>



  <!-- =========================
       目前叫號
  ========================= -->

  <div class="current-call">


    <div class="current-title">

      目前叫號

    </div>


    <div
      id="currentNumber"
      class="current-number"
    >

      尚未叫號

    </div>


  </div>



  <!-- =========================
       系統狀態
  ========================= -->

  <div
    id="systemStatus"
    class="system-status system-ready"
  >

    🟢 系統可以叫號

  </div>



  <!-- =========================
       控制按鈕
  ========================= -->

  <div class="controls">


    <button
      id="refreshButton"
      class="refresh"
      onclick="refreshAll()"
    >

      🔄 重新整理

    </button>



    <button
      id="resetButton"
      class="reset"
      onclick="clearAllTickets()"
    >

      🗑️ 清空所有號碼

    </button>


  </div>



  <!-- =========================
       狀態訊息
  ========================= -->

  <div
    id="statusMessage"
    class="status-message"
  >
  </div>



  <!-- =========================
       等待中的號碼
  ========================= -->

  <h2>
    等待中的號碼
  </h2>


  <div
    id="ticketList"
    class="ticket-grid"
  >
  </div>


</div>



<script>


// =====================================
// Supabase 設定
// =====================================


const SUPABASE_URL =
  "https://ubrjcadpfdfymbjwubfg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_0J9AWhVkRRYDehVffrmNdQ_jlOOqVAw";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



// =====================================
// 全域變數
// =====================================


let queueSettings = null;

let isCalling = false;

let countdownTimer = null;



// =====================================
// 判斷目前是否鎖定
// =====================================


function isSystemLocked() {


  if (
    !queueSettings ||
    !queueSettings.call_lock_until
  ) {

    return false;

  }


  const lockUntil =
    new Date(
      queueSettings.call_lock_until
    );


  const now =
    new Date();


  return lockUntil > now;


}



// =====================================
// 取得剩餘秒數
// =====================================


function getRemainingSeconds() {


  if (
    !queueSettings ||
    !queueSettings.call_lock_until
  ) {

    return 0;

  }


  const lockUntil =
    new Date(
      queueSettings.call_lock_until
    );


  const now =
    new Date();


  const diff =
    lockUntil - now;


  if (diff <= 0) {

    return 0;

  }


  return Math.ceil(
    diff / 1000
  );


}



// =====================================
// 更新系統鎖定畫面
// =====================================


function updateLockUI() {


  const systemStatus =
    document.getElementById(
      "systemStatus"
    );


  const ticketList =
    document.getElementById(
      "ticketList"
    );


  const refreshButton =
    document.getElementById(
      "refreshButton"
    );


  const resetButton =
    document.getElementById(
      "resetButton"
    );


  const locked =
    isSystemLocked();


  const remaining =
    getRemainingSeconds();



  // =====================================
  // 系統正在鎖定
  // =====================================


  if (locked) {


    systemStatus.className =
      "system-status system-locked";


    systemStatus.textContent =
      `🔴 系統正在叫號，${remaining} 秒後恢復`;


    ticketList.classList.add(
      "locked-overlay"
    );


    refreshButton.disabled = true;

    resetButton.disabled = true;


    document
      .querySelectorAll(
        ".ticket"
      )
      .forEach(
        button => {

          button.disabled = true;

        }
      );


  }


  // =====================================
  // 系統可以叫號
  // =====================================


  else {


    systemStatus.className =
      "system-status system-ready";


    systemStatus.textContent =
      "🟢 系統可以叫號";


    ticketList.classList.remove(
      "locked-overlay"
    );


    refreshButton.disabled = false;

    resetButton.disabled = false;


    document
      .querySelectorAll(
        ".ticket"
      )
      .forEach(
        button => {

          button.disabled =
            isCalling;

        }
      );


  }


}



// =====================================
// 啟動倒數計時器
// =====================================


function startCountdown() {


  // 清除舊計時器


  if (countdownTimer) {

    clearInterval(
      countdownTimer
    );

  }



  updateLockUI();



  countdownTimer =
    setInterval(
      () => {


        updateLockUI();


        // 倒數結束


        if (!isSystemLocked()) {


          clearInterval(
            countdownTimer
          );


          countdownTimer = null;


          loadQueueSettings();


          loadTickets();


        }


      },
      250
    );


}



// =====================================
// 讀取 queue_settings
// =====================================


async function loadQueueSettings() {


  const {

    data,

    error

  } = await supabaseClient

    .from("queue_settings")

    .select("*")

    .order(
      "updated_at",
      {
        ascending: false
      }
    )

    .limit(1)

    .maybeSingle();



  if (error) {


    console.error(
      "讀取 queue_settings 失敗：",
      error
    );


    return;

  }



  queueSettings =
    data;



  // 更新目前叫號


  const currentNumberElement =
    document.getElementById(
      "currentNumber"
    );


  if (
    queueSettings &&
    queueSettings.current_number
  ) {


    currentNumberElement.textContent =
      queueSettings.current_number;


  }


  else {


    currentNumberElement.textContent =
      "尚未叫號";


  }



  updateLockUI();



  // 如果目前正在鎖定


  if (isSystemLocked()) {

    startCountdown();

  }


}



// =====================================
// 讀取等待中的號碼
// =====================================


async function loadTickets() {


  const ticketList =
    document.getElementById(
      "ticketList"
    );


  const statusMessage =
    document.getElementById(
      "statusMessage"
    );


  ticketList.innerHTML = "";


  statusMessage.textContent =
    "載入中...";



  const {

    data,

    error

  } = await supabaseClient

    .from("tickets")

    .select("*")

    .eq(
      "status",
      "waiting"
    )

    .order(
      "ticket_number",
      {
        ascending: true
      }
    );



  // =====================================
  // 發生錯誤
  // =====================================


  if (error) {


    console.error(error);


    ticketList.innerHTML = `

      <div class="empty">

        ❌ 讀取資料失敗

        <br><br>

        ${error.message}

      </div>

    `;


    statusMessage.textContent =
      "";


    return;

  }



  // =====================================
  // 顯示等待人數
  // =====================================


  statusMessage.textContent =
    `目前共有 ${data.length} 位等待中`;



  // =====================================
  // 沒有等待號碼
  // =====================================


  if (data.length === 0) {


    ticketList.innerHTML = `

      <div class="empty">

        目前沒有等待中的號碼

      </div>

    `;


    return;

  }



  // =====================================
  // 建立號碼按鈕
  // =====================================


  data.forEach(
    ticket => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "ticket";


      button.disabled =
        isSystemLocked() ||
        isCalling;



      button.innerHTML = `

        ${ticket.display_number}

        <small>

          點擊叫號 🔊

        </small>

      `;



      button.addEventListener(

        "click",

        () => {

          callTicket(
            ticket
          );

        }

      );



      ticketList.appendChild(
        button
      );


    }
  );


}



// =====================================
// 執行叫號
// =====================================


async function callTicket(ticket) {


  // =====================================
  // 前端再次檢查
  // =====================================


  if (isSystemLocked()) {


    alert(
      "系統目前正在叫號中，請稍後再試"
    );


    return;

  }



  if (isCalling) {


    return;

  }



  // =====================================
  // 確認叫號
  // =====================================


  const confirmed =
    confirm(
      `確定要叫號 ${ticket.display_number} 嗎？`
    );


  if (!confirmed) {

    return;

  }



  // =====================================
  // 設定本機正在處理
  // =====================================


  isCalling = true;


  document
    .getElementById(
      "statusMessage"
    )
    .textContent =
      `正在叫號 ${ticket.display_number}...`;



  updateLockUI();


  document
    .querySelectorAll(
      ".ticket"
    )
    .forEach(
      button => {

        button.disabled = true;

      }
    );



  // =====================================
  // 呼叫 Supabase Function
  // =====================================


  const {

    data,

    error

  } = await supabaseClient.rpc(

    "call_ticket",

    {

      p_ticket_id:
        ticket.id

    }

  );



  // =====================================
  // 叫號失敗
  // =====================================


  if (error) {


    console.error(
      "叫號失敗：",
      error
    );


    isCalling = false;


    alert(
      "叫號失敗：\n" +
      error.message
    );


    await loadQueueSettings();

    await loadTickets();


    return;

  }



  // =====================================
  // 叫號成功
  // =====================================


  isCalling = false;



  console.log(
    "叫號成功：",
    data
  );



  // 更新目前號碼


  document
    .getElementById(
      "currentNumber"
    )
    .textContent =
      ticket.display_number;



  // 重新讀取設定


  await loadQueueSettings();



  // 重新讀取等待列表


  await loadTickets();



  // 啟動倒數


  startCountdown();


}



// =====================================
// 清空所有號碼
// =====================================


async function clearAllTickets() {


  // 如果正在鎖定


  if (isSystemLocked()) {


    alert(
      "系統正在叫號中，暫時無法清空"
    );


    return;

  }



  const confirmed =
    confirm(

      "⚠️ 確定要清空目前所有號碼嗎？\n\n" +

      "清空後下一個號碼將重新從 A001 開始。"

    );



  if (!confirmed) {

    return;

  }



  // 防止重複操作


  isCalling = true;


  updateLockUI();



  const {

    error

  } = await supabaseClient.rpc(

    "clear_all_tickets"

  );



  // =====================================
  // 清空失敗
  // =====================================


  if (error) {


    console.error(error);


    isCalling = false;


    alert(
      "清空失敗：\n" +
      error.message
    );


    updateLockUI();


    return;

  }



  // =====================================
  // 清空成功
  // =====================================


  isCalling = false;



  document
    .getElementById(
      "currentNumber"
    )
    .textContent =
      "尚未叫號";



  alert(
    "✅ 所有號碼已成功清空"
  );



  await refreshAll();


}



// =====================================
// 手動重新整理
// =====================================


async function refreshAll() {


  await loadQueueSettings();

  await loadTickets();


}



// =====================================
// Tickets 即時同步
// =====================================


supabaseClient

  .channel(
    "tickets-realtime-channel"
  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "tickets"

    },

    async () => {


      console.log(
        "Tickets 資料已更新"
      );


      await loadTickets();


    }

  )

  .subscribe();



// =====================================
// Queue Settings 即時同步
// =====================================


supabaseClient

  .channel(
    "queue-settings-realtime-channel"
  )

  .on(

    "postgres_changes",

    {

      event: "*",

      schema: "public",

      table: "queue_settings"

    },

    async payload => {


      console.log(
        "Queue Settings 已更新：",
        payload
      );


      await loadQueueSettings();


      await loadTickets();


    }

  )

  .subscribe();



// =====================================
// 網頁啟動
// =====================================


async function initialize() {


  await loadQueueSettings();

  await loadTickets();


}


initialize();


</script>


</body>

</html>
