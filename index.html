<script>

  // ================================
  // Supabase 設定
  // ================================

  const SUPABASE_URL =
    "https://ubrjcadpfdfymbjwubfg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_0J9AWhVkRRYDehVffrmNdQ_jlOOqVAw";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ================================
  // HTML 元素
  // ================================

  const takeTicketButton =
    document.getElementById("takeTicketButton");

  const loading =
    document.getElementById("loading");

  const takeTicketSection =
    document.getElementById("takeTicketSection");

  const ticketSection =
    document.getElementById("ticketSection");

  const ticketNumber =
    document.getElementById("ticketNumber");


  // ================================
  // 顯示取到的號碼
  // ================================

  function showTicket(number) {

    takeTicketSection.classList.add("hidden");

    ticketSection.classList.remove("hidden");

    ticketNumber.textContent = number;

  }


  // ================================
  // 顯示取號畫面
  // ================================

  function showTakeTicket() {

    ticketSection.classList.add("hidden");

    takeTicketSection.classList.remove("hidden");

  }


  // ================================
  // 檢查之前的號碼是否仍然有效
  // ================================

  async function checkSavedTicket() {

    const savedTicketId =
      localStorage.getItem("queue_ticket_id");


    // 沒有舊紀錄

    if (!savedTicketId) {

      showTakeTicket();

      return;

    }


    // 到資料庫確認這張號碼是否還存在

    const {

      data,
      error

    } = await supabaseClient

      .from("tickets")

      .select("*")

      .eq(
        "id",
        savedTicketId
      )

      .maybeSingle();


    // 找不到號碼
    // 代表後台已經清空

    if (

      error ||
      !data

    ) {

      console.log(
        "舊號碼已失效，自動清除手機紀錄"
      );


      localStorage.removeItem(
        "queue_ticket_id"
      );


      localStorage.removeItem(
        "queue_ticket_number"
      );


      showTakeTicket();

      return;

    }


    // 如果號碼存在

    showTicket(
      data.display_number
    );

  }


  // ================================
  // 取得號碼
  // ================================

  takeTicketButton.addEventListener(

    "click",

    async () => {


      // 防止重複點擊

      takeTicketButton.disabled = true;


      loading.style.display =
        "block";


      try {


        // 呼叫 Supabase Function

        const {

          data,
          error

        } = await supabaseClient.rpc(
          "take_ticket"
        );


        if (error) {

          throw error;

        }


        // 確認有成功取得資料

        if (

          !data ||
          data.length === 0

        ) {

          throw new Error(
            "沒有取得號碼資料"
          );

        }


        const ticket =
          data[0];


        // ================================
        // 儲存 Ticket ID
        // ================================

        localStorage.setItem(

          "queue_ticket_id",

          ticket.ticket_id

        );


        // 保留顯示號碼

        localStorage.setItem(

          "queue_ticket_number",

          ticket.display_number

        );


        // 顯示號碼

        showTicket(
          ticket.display_number
        );


      }


      catch (error) {


        console.error(error);


        alert(
          "取得號碼失敗，請稍後再試"
        );


        takeTicketButton.disabled =
          false;


      }


      finally {


        loading.style.display =
          "none";


      }


    }

  );


  // ================================
  // 網頁啟動
  // ================================

  checkSavedTicket();


</script>
