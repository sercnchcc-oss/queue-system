<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>現場叫號系統</title>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      font-family:

        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;


      background:

        linear-gradient(
          135deg,
          #111827,
          #1f2937
        );


      color: white;

    }


    /* =========================
       主畫面
    ========================= */

    .display-container {

      height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 40px;

    }


    /* =========================
       標題
    ========================= */

    .title {

      font-size: clamp(
        32px,
        4vw,
        70px
      );

      letter-spacing: 8px;

      margin-bottom: 40px;

      color: #d1d5db;

    }


    /* =========================
       現在請
    ========================= */

    .please {

      font-size: clamp(
        40px,
        5vw,
        90px
      );

      margin-bottom: 20px;

    }


    /* =========================
       號碼
    ========================= */

    .number {

      font-size: clamp(
        150px,
        25vw,
        500px
      );

      font-weight: bold;

      letter-spacing: 15px;

      line-height: 1;

      text-shadow:

        0 0 30px rgba(255,255,255,.2),

        0 0 60px rgba(255,255,255,.1);

    }


    /* =========================
       請入場
    ========================= */

    .enter {

      margin-top: 40px;

      font-size: clamp(
        35px,
        5vw,
        80px
      );

      color: #d1d5db;

    }


    /* =========================
       叫號動畫
    ========================= */

    .announce {

      animation:

        announceAnimation

        1.5s

        ease-in-out;

    }


    @keyframes announceAnimation {

      0% {

        transform: scale(.7);

        opacity: 0;

      }


      50% {

        transform: scale(1.08);

        opacity: 1;

      }


      100% {

        transform: scale(1);

        opacity: 1;

      }

    }


    /* =========================
       啟動音效畫面
    ========================= */

    #audioStartScreen {

      position: fixed;

      inset: 0;

      z-index: 999;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 30px;

      background:

        linear-gradient(
          135deg,
          #111827,
          #1f2937
        );

    }


    #audioStartScreen h1 {

      font-size: 45px;

      margin: 0;

    }


    #audioStartScreen p {

      font-size: 22px;

      color: #d1d5db;

    }


    #startAudioButton {

      padding:

        20px

        50px;


      border: none;

      border-radius: 15px;

      cursor: pointer;

      font-size: 25px;

      font-weight: bold;

      background: white;

      color: #111827;

    }


    #startAudioButton:hover {

      transform: scale(1.05);

    }


    /* =========================
       連線狀態
    ========================= */

    .connection-status {

      position: fixed;

      right: 20px;

      bottom: 15px;

      font-size: 14px;

      color: #9ca3af;

    }

  </style>

</head>



<body>


<!-- =========================
     啟動廣播
========================= -->

<div id="audioStartScreen">

  <h1>
    🔊 叫號系統
  </h1>

  <p>
    請點擊下方按鈕啟動廣播系統
  </p>

  <button id="startAudioButton">

    啟動叫號系統

  </button>

</div>



<!-- =========================
     主要畫面
========================= -->

<div class="display-container">


  <div class="title">

    🎫 現場叫號系統

  </div>


  <div class="please">

    現在請

  </div>


  <div
    id="currentNumber"
    class="number"
  >

    等待叫號

  </div>


  <div class="enter">

    請入場

  </div>


</div>



<!-- =========================
     連線狀態
========================= -->

<div
  id="connectionStatus"
  class="connection-status"
>

  ● 正在連線

</div>



<script>


/* =========================
   Supabase 設定
========================= */

const SUPABASE_URL =
  "https://ubrjcadpfdfymbjwubfg.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_0J9AWhVkRRYDehVffrmNdQ_jlOOqVAw";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* =========================
   HTML 元素
========================= */

const currentNumberElement =
  document.getElementById(
    "currentNumber"
  );


const audioStartScreen =
  document.getElementById(
    "audioStartScreen"
  );


const startAudioButton =
  document.getElementById(
    "startAudioButton"
  );


const connectionStatus =
  document.getElementById(
    "connectionStatus"
  );



/* =========================
   系統變數
========================= */

let audioEnabled = false;


/*
  記錄最後一次叫號

  用來避免：

  UPDATE 同一個號碼
  ↓
  重複播放語音
*/

let lastCalledNumber = null;



/* =========================
   啟動語音系統
========================= */

startAudioButton.addEventListener(
  "click",
  () => {

    audioEnabled = true;


    audioStartScreen.style.display =
      "none";


    /*
      初始化瀏覽器語音

      因為 Chrome / Edge
      通常需要使用者先互動
    */

    const testSpeech =
      new SpeechSynthesisUtterance(
        ""
      );


    testSpeech.lang =
      "zh-TW";


    window.speechSynthesis.speak(
      testSpeech
    );

  }
);



/* =========================
   顯示等待叫號
========================= */

function showWaiting() {

  currentNumberElement.textContent =
    "等待叫號";


  currentNumberElement.classList.remove(
    "announce"
  );


  lastCalledNumber = null;

}



/* =========================
   讀取目前叫號
========================= */

async function loadCurrentNumber() {

  const {

    data,
    error

  } = await supabaseClient

    .from("queue_settings")

    .select("*")

    .order(
      "updated_at",
      {
        ascending: false
      }
    )

    .limit(1)

    .maybeSingle();



  if (error) {

    console.error(
      "讀取目前叫號失敗：",
      error
    );


    connectionStatus.textContent =
      "● 資料讀取失敗";


    return;

  }


  /*
    有目前叫號
  */

  if (

    data &&
    data.current_number

  ) {


    currentNumberElement.textContent =
      data.current_number;


    /*
      網頁剛開啟時
      不播放舊叫號
    */

    lastCalledNumber =
      data.current_number;


  }

  else {


    /*
      沒有叫號資料

      例如：

      後台剛清空所有號碼
    */

    showWaiting();

  }

}



/* =========================
   更新叫號畫面
========================= */

function updateDisplay(number) {

  currentNumberElement.textContent =
    number;


  /*
    重新觸發動畫
  */

  currentNumberElement.classList.remove(
    "announce"
  );


  void currentNumberElement.offsetWidth;


  currentNumberElement.classList.add(
    "announce"
  );

}



/* =========================
   語音叫號
========================= */

function speakNumber(number) {

  if (!audioEnabled) {

    return;

  }


  /*
    停止前一次語音
  */

  window.speechSynthesis.cancel();



  /*
    A005

    變成：

    A 0 0 5

    讓語音比較容易正確唸出來
  */

  const characters =
    number
      .split("")
      .join(" ");



  const message =
    `請 ${characters} 號入場`;



  const speech =
    new SpeechSynthesisUtterance(
      message
    );


  speech.lang =
    "zh-TW";


  speech.rate =
    0.85;


  speech.pitch =
    1;



  window.speechSynthesis.speak(
    speech
  );

}



/* =========================
   Supabase 即時監聽
========================= */

const channel =

  supabaseClient

    .channel(
      "display-queue-channel"
    )


    .on(

      "postgres_changes",

      {

        event: "UPDATE",

        schema: "public",

        table: "queue_settings"

      },


      payload => {


        const newNumber =
          payload.new.current_number;



        /* =========================
           後台清空叫號
        ========================= */

        if (!newNumber) {


          showWaiting();


          /*
            清空時不播放語音
          */

          return;

        }



        /* =========================
           新的叫號
        ========================= */

        if (

          newNumber !==
          lastCalledNumber

        ) {


          lastCalledNumber =
            newNumber;


          /*
            更新大螢幕
          */

          updateDisplay(
            newNumber
          );


          /*
            播放語音
          */

          speakNumber(
            newNumber
          );

        }


      }

    )


    .subscribe(

      status => {


        if (

          status === "SUBSCRIBED"

        ) {


          connectionStatus.textContent =
            "● 即時連線正常";

        }


        else if (

          status === "CHANNEL_ERROR"

        ) {


          connectionStatus.textContent =
            "● 即時連線錯誤";

        }


        else if (

          status === "TIMED_OUT"

        ) {


          connectionStatus.textContent =
            "● 連線逾時";

        }


        else if (

          status === "CLOSED"

        ) {


          connectionStatus.textContent =
            "● 連線已關閉";

        }

      }

    );



/* =========================
   網頁啟動
========================= */

loadCurrentNumber();


</script>


</body>

</html>
